name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Verificar acceso a los submódulos privados
        working-directory: .
        env:
          SUBMODULES_TOKEN: ${{ secrets.SUBMODULES_TOKEN }}
        run: |
          if [ -z "$SUBMODULES_TOKEN" ]; then
            echo "::error::Configura el secreto SUBMODULES_TOKEN en D-PISI con lectura de Contents para D-PISI, B-PISI y F-PISI. B-PISI es privado; el token automático no puede descargarlo."
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN }}
      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Typecheck, build y pruebas
        run: npm run check
      - name: Autenticación con PostgreSQL aislado
        run: npm run test:auth:integration

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Verificar acceso a los submódulos privados
        working-directory: .
        env:
          SUBMODULES_TOKEN: ${{ secrets.SUBMODULES_TOKEN }}
        run: |
          if [ -z "$SUBMODULES_TOKEN" ]; then
            echo "::error::Configura el secreto SUBMODULES_TOKEN en D-PISI con lectura de Contents para D-PISI, B-PISI y F-PISI. B-PISI es privado; el token automático no puede descargarlo."
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN }}
      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Typecheck, lint y build
        run: npm run check
